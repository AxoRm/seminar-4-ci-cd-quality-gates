name: Example Python CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the same example dependencies as GitLab CI
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Fast checks
        run: |
          ruff check src tests
          mypy src/shop
          python -m build --wheel
          sha256sum dist/*.whl > dist/SHA256SUMS
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/dependencies.json
      - name: Unit, integration and API tests
        run: |
          pytest tests/unit -q --cov=shop --cov-branch --cov-report=xml:reports/coverage-unit.xml --junitxml=reports/unit.xml
          mv .coverage reports/.coverage.unit
          pytest tests/integration -q --cov=shop --cov-branch --cov-report=xml:reports/coverage-integration.xml --junitxml=reports/integration.xml
          mv .coverage reports/.coverage.integration
          pytest tests/api -q --cov=shop --cov-branch --cov-report=xml:reports/coverage-api.xml --junitxml=reports/api.xml
          mv .coverage reports/.coverage.api
          coverage combine reports
          coverage json -o reports/coverage.json
          coverage xml -o reports/coverage.xml
          python ci/check_coverage.py reports/coverage.json
      - name: Changed-line coverage in pull request
        if: github.event_name == 'pull_request'
        run: diff-cover reports/coverage.xml --compare-branch "origin/${{ github.base_ref }}" --fail-under=85
      - name: Example backend journey
        run: pytest tests/e2e -q
